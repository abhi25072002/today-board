<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Today Board</title>
  <meta name="description" content="Daily tasks, tags and calendar, synced between iPhone and Mac.">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Today">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="heading">
        <h1 id="title">Today</h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <div class="top-actions">
        <button id="syncBtn" class="sync-pill" type="button" title="Sync status"><span class="dot"></span><span id="syncText">Local</span></button>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66a.49.49 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65a7.3 7.3 0 0 0 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.66Z"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" data-view="today" role="tab">Today</button>
      <button type="button" data-view="board" role="tab">Board</button>
      <button type="button" data-view="prep" role="tab">Prep</button>
      <button type="button" data-view="calendar" role="tab">Calendar</button>
      <button type="button" data-view="history" role="tab">History</button>
    </nav>
    <form id="quickAdd" class="quick-add" autocomplete="off">
      <input id="quickInput" type="text" enterkeyhint="done" placeholder="Task, link, or Groceries: milk, eggs  (#prep, tomorrow)">
      <button type="submit" aria-label="Add task">Add</button>
    </form>
    <div id="tagFilter" class="chips filter"></div>
  </header>

  <div id="banner"></div>
  <main id="view"></main>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
